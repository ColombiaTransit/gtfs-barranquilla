# Real per-route headways for feeder (alimentadora) routes, split by service
# day type -- the only actual frequency/headway source found for this
# pipeline (see the three separately-scraped 2026 PDFs in the README for
# *operating windows*, which give no headways at all).
#
# SOURCES (all uploaded directly by the user; none reachable by this
# pipeline's own fetch stage -- see the "how this file gets used" note in
# frequency_reference.py):
#   weekday:  HORARIO_FUNCIONAMIENTO_ALIMENTADORAS_HABILES_10_DE_ENE_2023_6882e4b44f.pdf
#             filename says "10 DE ENE 2023", but the document's own title
#             text says "Vigente desde el Lunes 22 de Enero de 2024" --
#             internally inconsistent; treated as the 2024 date.
#   saturday: HORARIO_FUNCIONAMIENTO_ALIMENTADORAS_SABADO_14_DE_ENE_2023_95865fef57.pdf
#             "Vigente desde el Sábado 27 de Enero de 2024"
#   sunday:   HORARIO_FUNCIONAMIENTO_ALIMENTADORAS_DOM_Y_FES_15_DE_ENE_2023_ef1d6874ea.pdf
#             "Vigente desde el Domingo 28 de Enero de 2024"
# All three are the same one-week rollout (22, 27, 28 Jan 2024) and, as of
# 2026-09, the user confirmed no newer versions of these specific frequency
# tables exist.
#
# COVERAGE, on purpose narrower than the rest of the feed:
#   - Alimentadora (feeder) routes ONLY. None of the three source PDFs has
#     a troncal (trunk) section -- confirmed via `pdfinfo` (1 page each)
#     and the extracted text. Troncal routes always use the placeholder
#     headway, on every service day.
#   - A route not listed under a given day (including any alimentadora
#     route not in that day's table at all) keeps the placeholder headway
#     for that day specifically -- for example A9-4 doesn't appear in ANY
#     of these three 2024 tables (it may not have existed as a route yet;
#     the separately-scraped 2026 pages show it as weekend-only), so it
#     gets the placeholder on every service day.
#   - "Gran Malecón" appears in the Saturday/Sunday tables with real data,
#     but isn't a route code the routes with an "A" or "U" prefix pattern
#     this file's matching logic handles, and it's also flagged suspended
#     ("suspendida temporalmente") on the currently-scraped listing page,
#     so it's deliberately left out here rather than adding matching logic
#     for a route that's excluded from the build by default anyway.
#
# FORMAT: under each day, a route code (exactly as printed in that day's
# source PDF, matched via frequency_reference.py:normalize_route_code) maps
# to an ordered list of time bands. Most routes have one to three bands
# (a full-day figure, or mañana/valle/tarde peak-period figures); where a
# source PDF visually merges adjacent bands into one wider cell sharing a
# single frequency (confirmed by rendering the actual page image, not
# assumed from column position alone -- see U30's Saturday entry below),
# that's represented as one band spanning the full merged period.
#
# Two routes were "–" (no service) in the weekday table and are omitted
# from it: A5-6, and A9-4 (see A9-4's note above). A5-6 is also absent from
# the Saturday and Sunday tables. A9-4 is absent from all three.

