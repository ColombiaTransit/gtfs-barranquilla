name: Build GTFS feed

on:
  schedule:
    # Weekly, Monday 08:00 UTC (03:00 America/Bogota). Adjust once real
    # source update cadence is known.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/build-gtfs.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Fetch sources
        run: gtfsbaq fetch

      - name: Transform
        run: gtfsbaq transform

      - name: Build feed
        run: gtfsbaq build

      - name: Validate feed with the official MobilityData gtfs-validator
        run: |
          mkdir -p validation-report
          docker run --rm \
            -v "${{ github.workspace }}/data/gtfs:/gtfs" \
            -v "${{ github.workspace }}/validation-report:/report" \
            ghcr.io/mobilitydata/gtfs-validator:latest \
            -i /gtfs/gtfs.zip -o /report --country_code CO

      - name: Fail the build on any ERROR-severity notice
        run: |
          python3 - <<'PYEOF'
          import json, sys

          with open("validation-report/report.json") as f:
              report = json.load(f)

          errors = [n for n in report.get("notices", []) if n.get("severity") == "ERROR"]
          if errors:
              print(f"gtfs-validator found {len(errors)} distinct ERROR-level notice type(s):")
              for e in errors:
                  print(f"  - {e['code']}: {e.get('totalNotices', '?')} occurrence(s)")
              sys.exit(1)
          print("gtfs-validator: no ERROR-level notices")
          PYEOF

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-validation-report
          path: validation-report
          retention-days: 90

      - name: Upload feed as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-feed
          path: data/gtfs/gtfs.zip
          retention-days: 90

      - name: Publish dated release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "feed-${{ github.run_id }}"
          name: "GTFS feed build ${{ github.run_id }}"
          files: |
            data/gtfs/gtfs.zip
            validation-report/report.html
          body: |
            Automated GTFS feed build for Transmetro (Barranquilla).
            Generated by .github/workflows/build-gtfs.yml on ${{ github.event_name }}.
            Validated with the official MobilityData gtfs-validator (report.html attached).
          make_latest: true
